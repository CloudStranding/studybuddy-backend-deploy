services:
  db:
    image: postgres:16
    restart: always
    container_name: postgres
    environment:
      POSTGRES_USER: springDB
      POSTGRES_PASSWORD: 51Jh6Gzd6w388UC
      POSTGRES_DB: studybuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springDB -d studybuddy"]
      interval: 1s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: springboot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studybuddy
      SPRING_DATASOURCE_USERNAME: springDB
      SPRING_DATASOURCE_PASSWORD: 51Jh6Gzd6w388UC
      SERVER_SERVLET_CONTEXT_PATH: /app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
