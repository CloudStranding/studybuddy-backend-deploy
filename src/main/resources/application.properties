spring.application.name=StudyBuddy_Backend

# ===========================
# Default DataSource: H2 (local development)
# Railway/Docker overrides these via environment variables for PostgreSQL
# ===========================
spring.datasource.url=jdbc:h2:mem:studybuddy
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (for viewing database during local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================
# JWT Configuration
# ===========================
jwt.secret=studybuddy_secret_key_must_be_at_least_32_characters
jwt.expiration=86400000

# ===========================
# Server Port
# ===========================
server.port=8080
